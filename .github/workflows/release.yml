name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - "CollectionViewer/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build (Release)
        run: dotnet build CollectionViewer.sln -c Release

      - name: Read plugin version from csproj
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content CollectionViewer/CollectionViewer.csproj
          $version = $csproj.Project.PropertyGroup.Version | Select-Object -First 1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Update pluginmaster.json
        shell: pwsh
        run: |
          $json = Get-Content pluginmaster.json -Raw | ConvertFrom-Json
          $json[0].AssemblyVersion = "${{ steps.version.outputs.version }}"
          $json[0].LastUpdate = [int][double]::Parse((Get-Date -UFormat %s))
          ($json | ConvertTo-Json -Depth 10) | Set-Content pluginmaster.json

      - name: Commit updated pluginmaster.json
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "pluginmaster.json unchanged, skipping commit."
          } else {
            git commit -m "Update pluginmaster.json for $($env:VERSION)"
            git push
          }
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Move the rolling 'latest' tag
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish GitHub release with the packaged plugin
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exists = gh release view latest 2>$null
          if (-not $exists) {
            gh release create latest --title "latest" --notes "Automated build - see pluginmaster.json for the version this corresponds to."
          }
          gh release upload latest "CollectionViewer/bin/x64/Release/CollectionViewer/latest.zip" --clobber
